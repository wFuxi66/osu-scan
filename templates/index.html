<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>osu!scan</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* min-height, not height: the card still scrolls when the viewport is short. */
        body {
            min-height: 100vh;
            display: grid;
            align-content: center;
        }

        .container {
            max-width: 460px;
            text-align: center;
        }

        .page-head {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 4px;
        }

        .page-head a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }

        .page-head a:hover {
            color: var(--accent-soft);
        }

        .logo {
            max-width: 200px;
            width: 70%;
            margin-bottom: 14px;
        }

        .tagline {
            font-size: 14px;
            color: var(--text-dim);
            margin: 0 auto 24px;
            max-width: 34em;
        }

        #username-input {
            width: 100%;
        }

        .mode-selection {
            display: grid;
            gap: 8px;
            margin: 20px 0;
            text-align: left;
        }

        .mode-option {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 13px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--line-soft);
            color: var(--text-dim);
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .mode-option:hover {
            border-color: var(--accent);
            color: var(--text);
        }

        .mode-option:has(input:checked) {
            border-color: var(--accent);
            background: rgba(233, 69, 96, 0.15);
            color: var(--text);
        }

        .mode-option input {
            accent-color: var(--accent);
            margin: 0;
            flex: 0 0 auto;
        }

        #scanBtn {
            width: 100%;
        }

        #progress {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #progress p {
            margin: 0;
            font-size: 15px;
            color: var(--info);
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .cancel-btn {
            background-color: #2c3e50;
            border: 1px solid var(--info);
        }

        .cancel-btn:hover {
            background-color: #34495e;
            border-color: var(--accent);
        }

        .error {
            color: #ff6b6b;
            margin-top: 15px;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('scanForm');
            const progressDiv = document.getElementById('progress');
            const statusText = document.getElementById('status-text');
            const scanBtn = document.getElementById('scanBtn');
            const cancelBtn = document.getElementById('cancelBtn');
            const errorMsg = document.getElementById('error-msg');

            let currentJobId = null;
            let isCancelled = false;
            let pollInterval = null;

            if (form) {
                form.addEventListener('submit', async (e) => {
                    e.preventDefault();

                    const usernameInput = document.getElementById('username-input');
                    const username = usernameInput ? usernameInput.value : '';
                    const modeInput = document.querySelector('input[name="mode"]:checked');
                    const mode = modeInput ? modeInput.value : 'gd';

                    if (!username) {
                        alert("Please enter a username or ID");
                        return;
                    }

                    // Reset UI
                    scanBtn.classList.add('hidden');
                    progressDiv.classList.remove('hidden');
                    statusText.textContent = "Initializing...";

                    isCancelled = false;
                    cancelBtn.disabled = false;
                    cancelBtn.textContent = "Cancel Scan";
                    if (errorMsg) errorMsg.style.display = 'none';

                    if (pollInterval) clearInterval(pollInterval);

                    try {
                        const formData = new FormData();
                        formData.append('username', username);
                        formData.append('mode', mode);

                        const startRes = await fetch('/api/start_scan', {
                            method: 'POST',
                            body: formData
                        });

                        if (!startRes.ok) {
                            throw new Error("Start Failed: " + startRes.statusText);
                        }

                        const startData = await startRes.json();

                        if (startData.error) {
                            alert(startData.error);
                            resetUI();
                            return;
                        }

                        currentJobId = startData.job_id;
                        pollStatus(currentJobId);

                    } catch (err) {
                        console.error(err);
                        alert("Network error starting scan: " + err.message);
                        resetUI();
                    }
                });
            }

            if (cancelBtn) {
                cancelBtn.addEventListener('click', async () => {
                    if (!currentJobId) return;
                    if (confirm("Stop scan?")) {
                        cancelBtn.disabled = true;
                        isCancelled = true;
                        statusText.textContent = "Cancelling...";
                        try {
                            await fetch(`/api/cancel_scan/${currentJobId}`, { method: 'POST' });
                        } catch (e) { console.error(e); }
                        finally {
                            setTimeout(() => { if (isCancelled) resetUI(); }, 1000);
                        }
                    }
                });
            }

            function pollStatus(jobId) {
                if (isCancelled) return;

                pollInterval = setInterval(async () => {
                    if (isCancelled) {
                        clearInterval(pollInterval);
                        resetUI();
                        return;
                    }

                    try {
                        const res = await fetch(`/api/status/${jobId}`);

                        if (res.status === 404) {
                            clearInterval(pollInterval);
                            alert("Job lost (Server Restarted). Please try again.");
                            resetUI();
                            return;
                        }

                        if (!res.ok) {
                            return;
                        }

                        const data = await res.json();

                        if (data.status === 'running') {
                            statusText.textContent = data.message;
                        } else if (data.status === 'done') {
                            clearInterval(pollInterval);
                            window.location.href = `/results_view/${jobId}`;
                        } else if (data.status === 'cancelled') {
                            clearInterval(pollInterval);
                            statusText.textContent = "Cancelled.";
                            setTimeout(resetUI, 1500);
                        } else if (data.status === 'error') {
                            clearInterval(pollInterval);
                            alert("Error: " + data.error);
                            resetUI();
                        }

                    } catch (err) {
                        console.error(err);
                    }
                }, 1000);
            }

            function resetUI() {
                if (scanBtn) {
                    scanBtn.disabled = false;
                    scanBtn.classList.remove('hidden');
                }
                if (progressDiv) progressDiv.classList.add('hidden');
                currentJobId = null;
                isCancelled = false;
                if (pollInterval) {
                    clearInterval(pollInterval);
                    pollInterval = null;
                }
            }
        });
    </script>
</head>

<body>
    <div class="container">
        <div class="page-head">
            <a href="/leaderboard">Global Leaderboards →</a>
        </div>

        <img src="{{ url_for('static', filename='logo.png') }}" alt="osu!scan" class="logo">

        <p class="tagline">
            See who guest-mapped your sets, whose sets you guest-mapped, and which nominators
            keep showing up on your maps.
        </p>

        <form id="scanForm">
            <input type="text" id="username-input" name="username" placeholder="Username or ID" required>

            <div class="mode-selection">
                <label class="mode-option">
                    <input type="radio" name="mode" value="gd" checked>
                    <span>Top GDer in my maps</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="mode" value="gd_hosts">
                    <span>Top mapper I made GDs for</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="mode" value="nominators">
                    <span>Top BN that nominated my maps</span>
                </label>
                <label class="mode-option">
                    <input type="radio" name="mode" value="bn">
                    <span>Top favorite mapper for a BN</span>
                </label>
            </div>

            <button type="submit" id="scanBtn">Start scan</button>
        </form>

        <div id="progress" class="hidden">
            <div class="spinner"></div>
            <p id="status-text">Starting scan...</p>
            <button id="cancelBtn" class="cancel-btn">Cancel scan</button>
        </div>

        <div class="site-footer">
            Made by <a href="https://osu.ppy.sh/users/24230576">Fuxi66</a>
            • Data from <a href="https://osu.ppy.sh">osu!</a>
            • <a href="https://paypal.me/wFuxi66" target="_blank" class="kofi-btn">Support ☕</a>
        </div>
    </div>
</body>

</html>
