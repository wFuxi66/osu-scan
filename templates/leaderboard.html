<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Leaderboards - osu!scan</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <a href="/" class="back-link">← Back to osu!scan</a>

        <h1>Global Leaderboards</h1>

        <div id="loading" class="loading-msg">Loading leaderboard data...</div>

        <div id="leaderboard-content" style="display:none;">
            <!-- Mode filter -->
            <div class="mode-tabs" id="mode-tabs">
                <button type="button" class="mode-tab active" data-mode="all">All</button>
                <button type="button" class="mode-tab" data-mode="osu">osu!</button>
                <button type="button" class="mode-tab" data-mode="taiko">Taiko</button>
                <button type="button" class="mode-tab" data-mode="catch">Catch</button>
                <button type="button" class="mode-tab" data-mode="mania">Mania</button>
            </div>

            <!-- Section tabs -->
            <div class="section-tabs" id="section-tabs">
                <button type="button" class="section-tab active" data-section="bns">Top BNs</button>
                <button type="button" class="section-tab" data-section="duos">Iconic BN Duos</button>
                <button type="button" class="section-tab" data-section="mappers">Most Played Mappers</button>
                <button type="button" class="section-tab" data-section="sets">Most Ranked Sets</button>
            </div>

            <!-- Top BNs -->
            <div id="section-bns" class="leaderboard-section active">
                <div class="search-form">
                    <input type="text" class="search-input" id="search-bns" placeholder="Search a nominator..."
                        autocomplete="off">
                    <button class="search-btn" id="search-bns-btn">Search</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th class="col-rank">#</th>
                                <th>Nominator</th>
                                <th class="col-count">Nominations</th>
                            </tr>
                        </thead>
                        <tbody id="bns-tbody"></tbody>
                    </table>
                </div>
                <div class="pagination" id="bns-pagination"></div>
            </div>

            <!-- Iconic BNs Duos -->
            <div id="section-duos" class="leaderboard-section">
                <div class="search-form">
                    <input type="text" class="search-input" id="search-duos" placeholder="Search a duo..."
                        autocomplete="off">
                    <button class="search-btn" id="search-duos-btn">Search</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead id="duos-thead">
                            <tr>
                                <th class="col-rank">#</th>
                                <th>Duo</th>
                                <th class="col-count">Maps Together</th>
                            </tr>
                        </thead>
                        <tbody id="duos-tbody"></tbody>
                    </table>
                </div>
                <div class="pagination" id="duos-pagination"></div>
            </div>

            <div class="scope-tabs" id="scope-tabs">
                <button type="button" class="scope-tab active" data-scope="all">Maps + GDs</button>
                <button type="button" class="scope-tab" data-scope="own">Their own maps</button>
                <button type="button" class="scope-tab" data-scope="guest">Their GDs</button>
            </div>

            <!-- Most Played Mappers -->
            <div id="section-mappers" class="leaderboard-section">
                <div class="search-form">
                    <input type="text" class="search-input" id="search-mappers" placeholder="Search a mapper..."
                        autocomplete="off">
                    <button class="search-btn" id="search-mappers-btn">Search</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th class="col-rank">#</th>
                                <th>Mapper</th>
                                <th class="col-count col-optional" id="mappers-diff-header">Difficulties</th>
                                <th class="col-plays">Playcount</th>
                            </tr>
                        </thead>
                        <tbody id="mappers-tbody"></tbody>
                    </table>
                </div>
                <div class="pagination" id="mappers-pagination"></div>
            </div>

            <!-- Most Ranked Sets -->
            <div id="section-sets" class="leaderboard-section">
                <div class="search-form">
                    <input type="text" class="search-input" id="search-sets" placeholder="Search a mapper..."
                        autocomplete="off">
                    <button class="search-btn" id="search-sets-btn">Search</button>
                </div>
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th class="col-rank">#</th>
                                <th>Mapper</th>
                                <th class="col-count" id="sets-header">Mapsets</th>
                            </tr>
                        </thead>
                        <tbody id="sets-tbody"></tbody>
                    </table>
                </div>
                <div class="pagination" id="sets-pagination"></div>
            </div>

            <div class="scan-info" id="scan-info"></div>
        </div>

        <div id="no-data" class="no-data" style="display:none;">
            No leaderboard data available yet. Scan has not been run.
        </div>

        <div class="site-footer">
            Made by <a href="https://osu.ppy.sh/users/24230576">Fuxi66</a>
            - Data from <a href="https://osu.ppy.sh">osu!</a>
            and <a href="https://bn.mappersguild.com">Mapper's Guild</a>
            - <a href="https://ko-fi.com/fuxi66" target="_blank" class="kofi-btn">Support ☕</a>
        </div>
    </div>

    <script>
        const PER_PAGE = 50;

        // State
        let rawData = null;
        let mapperData = null;
        let currentMode = 'all';
        let currentSection = 'bns';
        let searchBns = '';
        let searchDuos = '';
        let searchMappers = '';
        let currentScope = 'all';
        let searchSets = '';
        let pageSets = 1;
        let scopeAvailable = false;
        let pageBns = 1;
        let pageDuos = 1;
        let pageMappers = 1;

        // Read initial state from URL
        (function readURL() {
            const p = new URLSearchParams(window.location.search);
            if (p.get('mode')) currentMode = p.get('mode');
            if (p.get('section')) currentSection = p.get('section');
            if (p.get('scope')) currentScope = p.get('scope');
        })();

        // Fetch data once
        fetch('/api/leaderboard_data')
            .then(r => r.json())
            .then(data => {
                document.getElementById('loading').style.display = 'none';
                if (!data) {
                    document.getElementById('no-data').style.display = 'block';
                    return;
                }
                rawData = data;
                document.getElementById('leaderboard-content').style.display = 'block';
                initUI();
                render();
            })
            .catch(() => {
                document.getElementById('loading').textContent = 'Failed to load data.';
            });

        fetch('/api/mappers_data')
            .then(r => r.json())
            .then(data => {
                mapperData = data;
                // Data from a scan predating the split has no 'own' figures to filter on.
                scopeAvailable = (data && data.mappers || []).some(m => 'own_playcount' in m);
                if (!scopeAvailable) currentScope = 'all';
                updateScopeVisibility();
                renderMappers();
                renderSets();
                renderScanInfo();
            })
            .catch(() => { });

        function initUI() {
            // Mode tabs
            document.querySelectorAll('#mode-tabs .mode-tab').forEach(tab => {
                if (tab.dataset.mode === currentMode) tab.classList.add('active');
                else tab.classList.remove('active');
                tab.addEventListener('click', () => {
                    currentMode = tab.dataset.mode;
                    pageBns = 1;
                    pageDuos = 1;
                    pageMappers = 1;
                    pageSets = 1;
                    document.querySelectorAll('#mode-tabs .mode-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    updateURL();
                    render();
                });
            });

            // Section tabs
            document.querySelectorAll('.section-tab').forEach(tab => {
                if (tab.dataset.section === currentSection) tab.classList.add('active');
                else tab.classList.remove('active');
                tab.addEventListener('click', () => {
                    currentSection = tab.dataset.section;
                    document.querySelectorAll('.section-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    document.querySelectorAll('.leaderboard-section').forEach(s => s.classList.remove('active'));
                    document.getElementById('section-' + currentSection).classList.add('active');
                    updateScopeVisibility();
                    updateURL();
                    renderScanInfo();
                });
            });

            // Show correct section
            document.querySelectorAll('.leaderboard-section').forEach(s => s.classList.remove('active'));
            document.getElementById('section-' + currentSection).classList.add('active');
            updateScopeVisibility();

            // Search - BNs
            const searchBnsInput = document.getElementById('search-bns');
            const searchBnsBtn = document.getElementById('search-bns-btn');
            searchBnsBtn.addEventListener('click', () => {
                searchBns = searchBnsInput.value.trim().toLowerCase();
                pageBns = 1;
                render();
            });
            searchBnsInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); searchBnsBtn.click(); }
            });

            // Search - Duos
            const searchDuosInput = document.getElementById('search-duos');
            const searchDuosBtn = document.getElementById('search-duos-btn');
            searchDuosBtn.addEventListener('click', () => {
                searchDuos = searchDuosInput.value.trim().toLowerCase();
                pageDuos = 1;
                render();
            });
            searchDuosInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); searchDuosBtn.click(); }
            });

            // Scope tabs (own maps vs guest difficulties)
            document.querySelectorAll('#scope-tabs .scope-tab').forEach(tab => {
                if (tab.dataset.scope === currentScope) tab.classList.add('active');
                else tab.classList.remove('active');
                tab.addEventListener('click', () => {
                    currentScope = tab.dataset.scope;
                    pageMappers = 1;
                    pageSets = 1;
                    document.querySelectorAll('#scope-tabs .scope-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    updateURL();
                    renderMappers();
                    renderSets();
                });
            });

            // Search - Mappers
            const searchMappersInput = document.getElementById('search-mappers');
            const searchMappersBtn = document.getElementById('search-mappers-btn');
            searchMappersBtn.addEventListener('click', () => {
                searchMappers = searchMappersInput.value.trim().toLowerCase();
                pageMappers = 1;
                renderMappers();
            });
            searchMappersInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); searchMappersBtn.click(); }
            });

            // Search - Sets
            const searchSetsInput = document.getElementById('search-sets');
            const searchSetsBtn = document.getElementById('search-sets-btn');
            searchSetsBtn.addEventListener('click', () => {
                searchSets = searchSetsInput.value.trim().toLowerCase();
                pageSets = 1;
                renderSets();
            });
            searchSetsInput.addEventListener('keydown', e => {
                if (e.key === 'Enter') { e.preventDefault(); searchSetsBtn.click(); }
            });
        }

        // The scope filter drives both mapper ladders and means nothing on the BN ones.
        function updateScopeVisibility() {
            const el = document.getElementById('scope-tabs');
            el.hidden = !['mappers', 'sets'].includes(currentSection) || !scopeAvailable;
        }

        function updateURL() {
            const p = new URLSearchParams();
            if (currentMode !== 'all') p.set('mode', currentMode);
            if (currentSection !== 'bns') p.set('section', currentSection);
            if (currentScope !== 'all') p.set('scope', currentScope);
            const qs = p.toString();
            history.replaceState(null, '', '/leaderboard' + (qs ? '?' + qs : ''));
        }

        const MODE_ICONS = {
            'osu': 'https://i.ppy.sh/7e7d307810cc1c87d72ef49aa8e00b0a532bf1a1/68747470733a2f2f6f73752e7070792e73682f77696b692f696d616765732f7368617265642f6d6f64652f6f73752e706e67',
            'taiko': 'https://i.ppy.sh/76642fc45fefd770b0f7ace30437e64309ae68bf/68747470733a2f2f6f73752e7070792e73682f77696b692f696d616765732f7368617265642f6d6f64652f7461696b6f2e706e67',
            'catch': 'https://i.ppy.sh/fbcd428c2342a50e24972fd5ba4c9bea8082c445/68747470733a2f2f6f73752e7070792e73682f77696b692f696d616765732f7368617265642f6d6f64652f63617463682e706e67',
            'fruits': 'https://i.ppy.sh/fbcd428c2342a50e24972fd5ba4c9bea8082c445/68747470733a2f2f6f73752e7070792e73682f77696b692f696d616765732f7368617265642f6d6f64652f63617463682e706e67',
            'mania': 'https://i.ppy.sh/06fedd0caf3d993b5e1a8a8686118de95722353c/68747470733a2f2f6f73752e7070792e73682f77696b692f696d616765732f7368617265642f6d6f64652f6d616e69612e706e67',
        };

        function modeIcon(mode) {
            const url = MODE_ICONS[mode];
            if (!url) return '';
            return `<img src="${url}" class="mode-icon" title="${mode}" alt="${mode}">`;
        }

        const COMPACT = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });
        function compact(n) { return COMPACT.format(n); }

        function rankClass(r) {
            if (r === 1) return 'rank-gold';
            if (r === 2) return 'rank-silver';
            if (r === 3) return 'rank-bronze';
            return '';
        }

        function escapeHTML(s) {
            const el = document.createElement('span');
            el.textContent = s;
            return el.innerHTML;
        }

        function render() {
            renderBNs();
            renderDuos();
            renderMappers();
            renderSets();
            renderScanInfo();
        }

        function renderSets() {
            const tbody = document.getElementById('sets-tbody');
            if (!tbody) return;
            if (!mapperData || !mapperData.mappers) {
                tbody.innerHTML = '<tr><td colspan="3" style="color:#666;text-align:center;padding:20px;">Mapper data not available yet.</td></tr>';
                return;
            }
            if (!('sets' in (mapperData.mappers[0] || {}))) {
                tbody.innerHTML = '<tr><td colspan="3" style="color:#666;text-align:center;padding:20px;">This ladder needs a newer scan.</td></tr>';
                return;
            }

            let rows = mapperRows('display_sets');
            if (searchSets) rows = rows.filter(m => (m.username || '').toLowerCase().includes(searchSets));

            const totalPages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
            pageSets = Math.min(pageSets, totalPages);
            const page = rows.slice((pageSets - 1) * PER_PAGE, pageSets * PER_PAGE);

            if (page.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color:#666;text-align:center;padding:20px;">No results found.</td></tr>';
            } else {
                let html = '';
                for (const m of page) {
                    let icons = '';
                    if (currentMode === 'all') {
                        icons = Object.keys(m.by_mode || {}).filter(k => (m.by_mode[k] || 0) > 0).map(modeIcon).join('');
                    }
                    html += `<tr class="${rankClass(m.rank)}"><td>${m.rank}</td><td><a href="https://osu.ppy.sh/users/${m.osu_id}" target="_blank" class="username-link">${escapeHTML(m.username)}</a>${icons ? '<span class="mode-icons">' + icons + '</span>' : ''}</td><td>${m.display_sets}</td></tr>`;
                }
                tbody.innerHTML = html;
            }

            document.getElementById('sets-header').textContent =
                { all: 'Mapsets', own: 'Own mapsets', guest: 'Mapsets guested on' }[currentScope];

            renderPagination('sets-pagination', pageSets, totalPages, p => { pageSets = p; renderSets(); });
        }

        // Totals cover maps + GDs; only the 'own' figures are stored, so GDs are the remainder.
        function mapperRows(sortKey) {
            const rows = [];
            for (const m of mapperData.mappers) {
                const total = k => m[k] || 0;
                const perMode = k => {
                    const d = m[k] || {};
                    if (currentMode === 'catch') return (d.catch || 0) + (d.fruits || 0);
                    return d[currentMode] || 0;
                };
                const pick = currentMode === 'all' ? total : perMode;
                const fields = currentMode === 'all'
                    ? ['playcount', 'own_playcount', 'maps', 'own_maps', 'loved_playcount', 'own_loved_playcount', 'sets', 'own_sets']
                    : ['by_mode', 'own_by_mode', 'maps_by_mode', 'own_maps_by_mode', 'loved_by_mode', 'own_loved_by_mode', 'sets_by_mode', 'own_sets_by_mode'];
                const [allPc, ownPc, allMaps, ownMaps, allLoved, ownLoved, allSets, ownSets] = fields.map(pick);

                let pc, maps, loved, sets;
                if (currentScope === 'own') {
                    pc = ownPc; maps = ownMaps; loved = ownLoved; sets = ownSets;
                } else if (currentScope === 'guest') {
                    pc = allPc - ownPc; maps = allMaps - ownMaps; loved = allLoved - ownLoved; sets = allSets - ownSets;
                } else {
                    pc = allPc; maps = allMaps; loved = allLoved; sets = allSets;
                }
                if (pc > 0) rows.push({ ...m, display_pc: pc, display_maps: maps, display_loved: loved, display_sets: sets });
            }
            // Ties on set count are common, so playcount breaks them rather than leaving them arbitrary.
            rows.sort((a, b) => (b[sortKey] - a[sortKey]) || (b.display_pc - a.display_pc));
            for (let i = 0; i < rows.length; i++) rows[i].rank = i + 1;
            return rows;
        }

        function renderMappers() {
            const tbody = document.getElementById('mappers-tbody');
            if (!tbody) return;
            if (!mapperData || !mapperData.mappers) {
                tbody.innerHTML = '<tr><td colspan="4" style="color:#666;text-align:center;padding:20px;">Mapper data not available yet.</td></tr>';
                return;
            }

            let mappers = mapperRows('display_pc');
            if (searchMappers) mappers = mappers.filter(m => (m.username || '').toLowerCase().includes(searchMappers));

            const totalPages = Math.max(1, Math.ceil(mappers.length / PER_PAGE));
            pageMappers = Math.min(pageMappers, totalPages);
            const page = mappers.slice((pageMappers - 1) * PER_PAGE, pageMappers * PER_PAGE);

            if (page.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" style="color:#666;text-align:center;padding:20px;">No results found.</td></tr>';
            } else {
                let html = '';
                for (const m of page) {
                    let icons = '';
                    if (currentMode === 'all') {
                        icons = Object.keys(m.by_mode || {}).filter(k => (m.by_mode[k] || 0) > 0).map(modeIcon).join('');
                    }
                    html += `<tr class="${rankClass(m.rank)}"><td>${m.rank}</td><td><a href="https://osu.ppy.sh/users/${m.osu_id}" target="_blank" class="username-link">${escapeHTML(m.username)}</a>${icons ? '<span class="mode-icons">' + icons + '</span>' : ''}</td><td class="col-optional">${m.display_maps}</td><td class="col-plays">${m.display_pc.toLocaleString('en-US')}${m.display_loved ? `<span class="loved-count" title="Of which ${m.display_loved.toLocaleString('en-US')} plays are on loved difficulties">${compact(m.display_loved)} loved</span>` : ''}</td></tr>`;
                }
                tbody.innerHTML = html;
            }

            const heading = { all: 'Difficulties', own: 'Own difficulties', guest: 'Guest difficulties' }[currentScope];
            document.getElementById('mappers-diff-header').textContent = heading;

            renderPagination('mappers-pagination', pageMappers, totalPages, p => { pageMappers = p; renderMappers(); });
        }

        function renderBNs() {
            const tbody = document.getElementById('bns-tbody');
            if (!rawData || !rawData.top_bns) { tbody.innerHTML = '<tr><td colspan="3" style="color:#666;text-align:center;padding:20px;">No results found.</td></tr>'; return; }

            // Build filtered list
            let bns = [];
            for (const bn of rawData.top_bns) {
                // Handle both 'catch' and 'fruits' in the old data
                let count = 0;
                if (currentMode === 'all') {
                    count = bn.total || 0;
                } else if (currentMode === 'catch') {
                    count = ((bn.by_mode || {}).catch || 0) + ((bn.by_mode || {}).fruits || 0);
                } else {
                    count = (bn.by_mode || {})[currentMode] || 0;
                }

                if (count > 0) bns.push({ ...bn, display_count: count });
            }
            bns.sort((a, b) => b.display_count - a.display_count);

            // Assign ranks before search filter
            for (let i = 0; i < bns.length; i++) bns[i].rank = i + 1;

            // Search filter (preserves ranks)
            if (searchBns) bns = bns.filter(b => (b.username || '').toLowerCase().includes(searchBns));

            // Pagination
            const total = bns.length;
            const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
            pageBns = Math.min(pageBns, totalPages);
            const page = bns.slice((pageBns - 1) * PER_PAGE, pageBns * PER_PAGE);

            // Render rows
            if (page.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color:#666;text-align:center;padding:20px;">No results found.</td></tr>';
            } else {
                let html = '';
                for (const bn of page) {
                    const rc = rankClass(bn.rank);
                    // Show mode icons for all modes the BN participated in (when in All filter)
                    let icons = '';
                    if (currentMode === 'all') {
                        const modes = Object.keys(bn.by_mode || {}).filter(m => (bn.by_mode[m] || 0) > 0);
                        icons = modes.map(modeIcon).join('');
                    }
                    html += `<tr class="${rc}"><td>${bn.rank}</td><td><a href="https://osu.ppy.sh/users/${bn.osu_id}" target="_blank" class="username-link">${escapeHTML(bn.username)}</a>${icons ? '<span class="mode-icons">' + icons + '</span>' : ''}</td><td>${bn.display_count}</td></tr>`;
                }
                tbody.innerHTML = html;
            }

            // Pagination controls
            renderPagination('bns-pagination', pageBns, totalPages, p => { pageBns = p; render(); });
        }

        function renderDuos() {
            const tbody = document.getElementById('duos-tbody');
            const thead = document.getElementById('duos-thead');
            if (!rawData || !rawData.duos) { tbody.innerHTML = '<tr><td colspan="3" style="color:#666;text-align:center;padding:20px;">No results found.</td></tr>'; return; }

            // Always 3 columns - mode icon goes inline in the duo name cell
            thead.innerHTML = '<tr><th class="col-rank">#</th><th>Duo</th><th class="col-count">Maps Together</th></tr>';

            // Filter by mode
            let duos = rawData.duos;
            if (currentMode !== 'all') {
                if (currentMode === 'catch') {
                    duos = duos.filter(d => d.mode === 'catch' || d.mode === 'fruits');
                } else {
                    duos = duos.filter(d => d.mode === currentMode);
                }
            }

            // Assign ranks
            for (let i = 0; i < duos.length; i++) duos[i].rank = i + 1;

            // Search filter
            if (searchDuos) duos = duos.filter(d => ((d.bn1_name || '') + ' ' + (d.bn2_name || '')).toLowerCase().includes(searchDuos));

            // Pagination
            const total = duos.length;
            const totalPages = Math.max(1, Math.ceil(total / PER_PAGE));
            pageDuos = Math.min(pageDuos, totalPages);
            const page = duos.slice((pageDuos - 1) * PER_PAGE, pageDuos * PER_PAGE);

            if (page.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="color:#666;text-align:center;padding:20px;">No results found.</td></tr>';
            } else {
                let html = '';
                for (const duo of page) {
                    const rc = rankClass(duo.rank);
                    // Show mode icon inline only in All mode
                    const icon = currentMode === 'all' ? modeIcon(duo.mode || '') : '';
                    html += `<tr class="${rc}"><td>${duo.rank}</td><td><a href="https://osu.ppy.sh/users/${duo.bn1_id}" target="_blank" class="username-link">${escapeHTML(duo.bn1_name)}</a><span class="duo-separator">x</span><a href="https://osu.ppy.sh/users/${duo.bn2_id}" target="_blank" class="username-link">${escapeHTML(duo.bn2_name)}</a>${icon ? ' ' + icon : ''}</td><td>${duo.count}</td></tr>`;
                }
                tbody.innerHTML = html;
            }

            // Pagination controls
            renderPagination('duos-pagination', pageDuos, totalPages, p => { pageDuos = p; render(); });
        }

        function renderPagination(containerId, currentPage, totalPages, onPageChange) {
            const container = document.getElementById(containerId);
            if (totalPages <= 1) { container.innerHTML = ''; return; }

            const prevDisabled = currentPage <= 1 ? 'disabled' : '';
            const nextDisabled = currentPage >= totalPages ? 'disabled' : '';

            container.innerHTML = `
                <span class="pagination-btn ${prevDisabled}" id="${containerId}-prev">&#9664;</span>
                <span class="pagination-info">
                    Page <input type="number" class="page-input" id="${containerId}-input" value="${currentPage}" min="1" max="${totalPages}"> / ${totalPages}
                </span>
                <span class="pagination-btn ${nextDisabled}" id="${containerId}-next">&#9654;</span>
            `;

            document.getElementById(`${containerId}-prev`).addEventListener('click', () => {
                if (currentPage > 1) onPageChange(currentPage - 1);
            });
            document.getElementById(`${containerId}-next`).addEventListener('click', () => {
                if (currentPage < totalPages) onPageChange(currentPage + 1);
            });

            const pageInput = document.getElementById(`${containerId}-input`);
            const jumpTo = () => {
                let val = parseInt(pageInput.value, 10);
                if (isNaN(val) || val < 1) val = 1;
                if (val > totalPages) val = totalPages;
                if (val !== currentPage) onPageChange(val);
            };
            pageInput.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); jumpTo(); } });
            pageInput.addEventListener('blur', jumpTo);
        }

        function renderScanInfo() {
            const el = document.getElementById('scan-info');
            if (!rawData) { el.textContent = ''; return; }

            let lastScan = 'Never';
            const onMapperLadder = ['mappers', 'sets'].includes(currentSection);
            const stamp = onMapperLadder && mapperData ? mapperData.last_scan : rawData.last_scan;
            if (stamp) {
                try {
                    const dt = new Date(stamp);
                    lastScan = dt.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' }) + ', ' + dt.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
                } catch (e) {
                    lastScan = stamp;
                }
            }

            // Calculate 1st of next month for the next scheduled scan
            const now = new Date();
            const nextScanDate = new Date(Date.UTC(now.getUTCFullYear(), now.getUTCMonth() + 1, 1, 0, 0, 0));
            const nextScanStr = nextScanDate.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });

            const n = v => (v || 0).toLocaleString('en-US');
            const source = onMapperLadder
                ? `${n(mapperData && mapperData.total_mappers)} mappers over ${n(mapperData && mapperData.total_sets_scanned)} ranked & loved mapsets`
                : `${n(rawData.total_bns_scanned)} BNs scanned, ${n(rawData.total_sets_scanned)} sets processed`;
            el.innerHTML = `Last updated: ${lastScan} | ${source}<br><span class="next-scan">Next automated scan: ${nextScanStr}</span>`;
        }
    </script>
</body>

</html>
