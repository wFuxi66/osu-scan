{% extends "next_base.html" %}
{% set page = 'boards' %}
{% block title %}Leaderboards — osu!scan{% endblock %}

{% block content %}
<section class="page-head">
    <h1 class="wide" id="head-title">Leaderboards</h1>
    <p id="head-desc"></p>
    <div class="stats" id="stats"></div>
</section>

<div class="tabs" role="tablist" id="tabs"></div>

<div class="controls" style="padding-top:18px">
    <div class="control" id="scope-control">
        <label for="scope-seg">Counting</label>
        <div class="seg" id="scope-seg"></div>
    </div>
    <div class="control" id="mode-control">
        <label for="mode-seg">Mode</label>
        <div class="seg on-mode" id="mode-seg"></div>
    </div>
    <div class="control" id="loved-control">
        <label for="loved-seg">Loved maps</label>
        <div class="seg" id="loved-seg"></div>
    </div>
    <div class="search">
        <input type="text" id="q" autocomplete="off" spellcheck="false" aria-label="Find someone">
        <button class="clear" type="button" id="q-clear" aria-label="Clear the search" hidden>&times;</button>
    </div>
</div>

<div id="podium-slot"></div>

<div class="list" id="list">
    <div class="list-head">
        <span id="col-rank">#</span>
        <span></span>
        <span id="col-who">Mapper</span>
        <span class="n" id="col-n">Total</span>
    </div>
    <div id="rows"></div>
</div>

<div class="pager" id="pager"></div>

<div class="legend" id="legend">
    <span><i class="mode-icon osu"></i>osu!</span>
    <span><i class="mode-icon taiko"></i>Taiko</span>
    <span><i class="mode-icon catch"></i>Catch</span>
    <span><i class="mode-icon mania"></i>Mania</span>
</div>

<details class="note">
    <summary id="note-summary">How this leaderboard counts</summary>
    <div id="note-body"></div>
</details>
{% endblock %}

{% block scripts %}
<script>
    const PER_PAGE = 50;

    const BOARDS = {
        bns: {
            tab: 'Top nominators',
            title: 'Top nominators',
            desc: 'Who pushes the most mapsets through to ranked.',
            who: 'Nominator', unit: 'Nominations',
            note: ['A mapset needs two nominators, and it counts once for each of them. Adding this '
                + 'column up therefore gives you roughly twice the number of sets ever ranked, not the '
                + 'size of the ranked pool.'],
            scope: false, loved: false, modes: true,
        },
        duos: {
            tab: 'Nominator duos',
            title: 'Nominator duos',
            desc: 'The pairs who keep signing off the same mapsets.',
            who: 'Duo', unit: 'Sets together',
            note: ['A pair only scores when both of them nominated the same mapset, and that set counts '
                + 'once for the pair. Someone who nominates a great deal but rarely with the same partner '
                + 'can top the nominator leaderboard and be absent from this one.'],
            scope: false, loved: false, modes: true,
        },
        mappers: {
            tab: 'Most played mappers',
            title: 'Most played mappers',
            desc: 'Ranked by the plays on every difficulty they had a hand in.',
            who: 'Mapper', unit: 'Plays',
            note: ['A difficulty made by several mappers counts its full playcount for every one of them. '
                + 'That is why these totals run higher than sites crediting only the set host, and why '
                + 'adding the column up gives more plays than the ranked pool actually holds.',
            'Loved difficulties are in by default and called out under each total; switch them off to '
                + 'compare ranked plays alone.'],
            scope: true, loved: true, modes: true,
        },
        sets: {
            tab: 'Most ranked sets',
            title: 'Most ranked mapsets',
            desc: 'Straight from the counts osu! prints on each mapper\u2019s profile.',
            who: 'Mapper', unit: 'Mapsets',
            note: ['These are osu!\u2019s own figures: ranked mapsets hosted under "As host", guest '
                + 'participation under "As guest". No counting of our own, so they match a profile.',
            'Loved sets join the hosted figure when loved is on. osu! does not split loved out of guest '
                + 'participation, so those stay in it either way.',
            'A profile prints no split by mode, so we read the sets behind it and file each one under '
                + 'the mode its mapper worked in \u2014 the one they put the most difficulties in, if '
                + 'they did several. A set counts once and only once: a std set carrying a guest taiko '
                + 'difficulty is one std set for its host and one taiko set for that guest, so the modes '
                + 'always add back up to the figure on "All".'],
            scope: true, loved: true, modes: true,
        },
    };

    const SCOPES = [['all', 'Everything'], ['own', 'As host'], ['guest', 'As guest']];
    const MODES = [['all', 'All'], ['osu', 'osu!'], ['taiko', 'Taiko'], ['catch', 'Catch'], ['mania', 'Mania']];
    const LOVED = [['1', 'Included'], ['0', 'Excluded']];

    let bnData = null, mapperData = null, scopeAvailable = false;
    let board = 'bns', scope = 'all', mode = 'all', query = '', withLoved = true;
    // The mapset board has no per-mode figures to filter, so it ignores the mode segment.
    let emode = 'all';
    const pages = { bns: 1, duos: 1, mappers: 1, sets: 1 };

    // A leaderboard is worth linking to and worth sharing, so it lives in the URL.
    const params = new URLSearchParams(location.search);
    if (BOARDS[params.get('board')]) board = params.get('board');
    if (['all', 'own', 'guest'].includes(params.get('scope'))) scope = params.get('scope');
    if (MODES.some(([k]) => k === params.get('mode'))) mode = params.get('mode');
    if (params.get('loved') === '0') withLoved = false;

    function syncURL() {
        const p = new URLSearchParams();
        if (board !== 'bns') p.set('board', board);
        if (scope !== 'all') p.set('scope', scope);
        // A board that ignores the mode segment should not advertise a filter in its link.
        if (mode !== 'all' && BOARDS[board].modes) p.set('mode', mode);
        if (!withLoved) p.set('loved', '0');
        const qs = p.toString();
        history.replaceState(null, '', location.pathname + (qs ? '?' + qs : ''));
    }

    const $ = id => document.getElementById(id);
    const num = n => (n || 0).toLocaleString('en-US');
    const COMPACT = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });

    // A restricted or deleted account comes back as a placeholder; there is no profile to link to.
    const GONE = /^(User_\d+|ID:\d+)$/;
    const nameCell = (id, name) => GONE.test(name)
        ? '<a class="gone">Restricted account</a>'
        : `<a href="https://osu.ppy.sh/users/${id}" target="_blank" rel="noopener">${esc(name)}</a>`;

    function esc(s) {
        const el = document.createElement('span');
        el.textContent = s == null ? '' : s;
        return el.innerHTML;
    }

    // The initial sits underneath, so a missing avatar degrades to a letter, not an empty tile.
    const face = (id, name, cls) =>
        `<span class="${cls}">${GONE.test(name) ? '?' : esc((name || '?').trim().charAt(0).toUpperCase())}`
        + `<img src="https://a.ppy.sh/${id}" alt="" loading="lazy" decoding="async"`
        + ` onerror="this.remove()"></span>`;

    // A pair is one entry, so it gets one avatar: the two faces overlapped, the way a
    // pair of people is drawn everywhere else.
    const avatar = r => r.id2
        ? `<span class="duo-face">${face(r.id, r.name1, 'face')}${face(r.id2, r.name2, 'face')}</span>`
        : face(r.id, r.key, 'face');

    // The mode logos read at a glance the way four coloured dots never did.
    const MODE_NAMES = { osu: 'osu!', taiko: 'Taiko', catch: 'Catch', fruits: 'Catch', mania: 'Mania' };
    const glyph = m => `<i class="mode-icon ${m}" title="${MODE_NAMES[m] || m}"></i>`;

    function modeIcons(byMode) {
        const keys = Object.keys(byMode || {}).filter(k => (byMode[k] || 0) > 0);
        if (emode !== 'all' || !keys.length) return '';
        return '<span class="modes">' + keys.map(glyph).join('') + '</span>';
    }

    function pick(byMode, total) {
        if (emode === 'all') return total || 0;
        const d = byMode || {};
        if (emode === 'catch') return (d.catch || 0) + (d.fruits || 0);
        return d[emode] || 0;
    }

    /* ---------------- rows: every builder returns the whole ranked leaderboard ---------------- */

    function rowsBns() {
        const out = [];
        for (const bn of (bnData?.top_bns || [])) {
            const v = pick(bn.by_mode, bn.total);
            if (v > 0) out.push({
                key: bn.username, id: bn.osu_id, value: v, main: num(v),
                who: nameCell(bn.osu_id, bn.username) + modeIcons(bn.by_mode),
            });
        }
        return out.sort((a, b) => b.value - a.value);
    }

    function rowsDuos() {
        let duos = bnData?.duos || [];
        if (emode !== 'all') {
            duos = duos.filter(d => emode === 'catch'
                ? (d.mode === 'catch' || d.mode === 'fruits') : d.mode === emode);
        }
        duos = duos.slice().sort((a, b) => b.count - a.count);
        // The gauge reads against the best pair on the board, so it says how far off the
        // top a pair is rather than how it compares to whoever shares its page.
        const best = duos[0]?.count || 1;
        return duos.map(d => ({
            key: `${d.bn1_name} ${d.bn2_name}`, id: d.bn1_id, id2: d.bn2_id,
            name1: d.bn1_name, name2: d.bn2_name,
            value: d.count, main: num(d.count),
            who: nameCell(d.bn1_id, d.bn1_name) + '<span class="pair">\u00d7</span>'
                + nameCell(d.bn2_id, d.bn2_name) + modeIcons({ [d.mode]: 1 })
                + `<span class="gauge" style="--p:${(d.count / best * 100).toFixed(1)}%"></span>`,
        }));
    }

    // Each figure is stored as a flat total and as a per-mode breakdown; the mode segment picks one.
    const FIELDS = {
        pc: ['playcount', 'by_mode'], ownPc: ['own_playcount', 'own_by_mode'],
        lovedPc: ['loved_playcount', 'loved_by_mode'],
        ownLovedPc: ['own_loved_playcount', 'own_loved_by_mode'],
        maps: ['maps', 'maps_by_mode'], ownMaps: ['own_maps', 'own_maps_by_mode'],
        lovedMaps: ['loved_maps', 'loved_maps_by_mode'],
        ownLovedMaps: ['own_loved_maps', 'own_loved_maps_by_mode'],
        sets: ['sets', 'sets_by_mode'], ownSets: ['own_sets', 'own_sets_by_mode'],
    };

    // Only the "own" figures are stored, so a guest figure is the remainder.
    const byScope = (all, own) => scope === 'own' ? own : scope === 'guest' ? all - own : all;

    function mapperRows(valueOf, subOf) {
        const out = [];
        for (const m of (mapperData?.mappers || [])) {
            const g = k => {
                const [flat, perMode] = FIELDS[k];
                return emode === 'all' ? (m[flat] || 0) : pick(m[perMode], 0);
            };
            const allLoved = g('lovedPc'), ownLoved = g('ownLovedPc');
            let allPc = g('pc'), ownPc = g('ownPc'), allMaps = g('maps'), ownMaps = g('ownMaps');
            if (!withLoved) {
                allPc -= allLoved; ownPc -= ownLoved;
                allMaps -= g('lovedMaps'); ownMaps -= g('ownLovedMaps');
            }

            // osu! publishes these on every profile and that is the number people check
            // against; our own crawl pages the search index, which runs short of it. The
            // scan splits each category by the mode its mapper worked in, so a mode keeps
            // the official figures too. Only a scan from before that pass falls back.
            const p = (flat, perMode) => emode === 'all' ? (m[flat] || 0) : pick(m[perMode], 0);
            let allSets, ownSets;
            if (m.profile_ranked_sets == null
                || (emode !== 'all' && !mapperData.profile_modes)) {
                allSets = g('sets'); ownSets = g('ownSets');
            } else {
                ownSets = p('profile_ranked_sets', 'profile_ranked_by_mode')
                    + (withLoved ? p('profile_loved_sets', 'profile_loved_by_mode') : 0);
                allSets = ownSets + p('profile_guest_sets', 'profile_guest_by_mode');
            }

            out.push({
                name: m.username, id: m.osu_id, by_mode: m.by_mode,
                pc: byScope(allPc, ownPc), maps: byScope(allMaps, ownMaps),
                loved: withLoved ? byScope(allLoved, ownLoved) : 0,
                sets: byScope(allSets, ownSets),
            });
        }
        const ranked = out.filter(m => valueOf(m) > 0);
        ranked.sort((a, b) => valueOf(b) - valueOf(a) || b.pc - a.pc);
        return ranked.map(m => ({
            key: m.name, id: m.id, value: valueOf(m),
            main: num(valueOf(m)), sub: subOf(m),
            who: nameCell(m.id, m.name) + modeIcons(m.by_mode),
        }));
    }

    const rowsMappers = () => mapperRows(m => m.pc, m =>
        `${num(m.maps)} difficulties` + (m.loved > 0 ? ` · ${COMPACT.format(m.loved)} loved` : ''));
    const rowsSets = () => mapperRows(m => m.sets, () => '');

    const BUILD = { bns: rowsBns, duos: rowsDuos, mappers: rowsMappers, sets: rowsSets };

    /* ---------------- render ---------------- */

    function render() {
        const cfg = BOARDS[board];
        emode = cfg.modes ? mode : 'all';
        $('head-title').textContent = cfg.title;
        $('head-desc').textContent = cfg.desc;
        $('col-who').textContent = cfg.who;
        $('col-n').textContent = cfg.unit;
        $('scope-control').hidden = !(cfg.scope && scopeAvailable);
        $('mode-control').hidden = !cfg.modes;
        $('loved-control').hidden = !cfg.loved;
        $('legend').hidden = emode !== 'all';
        $('list').classList.toggle('duos', board === 'duos');
        $('note-body').innerHTML = cfg.note.map(p => `<p>${p}</p>`).join('');
        $('q').placeholder = board === 'duos' ? 'Find a nominator' : 'Find yourself, or anyone else';
        $('q-clear').hidden = query === '';

        document.querySelectorAll('#tabs button').forEach(b =>
            b.setAttribute('aria-selected', String(b.dataset.k === board)));
        document.querySelectorAll('#scope-seg button').forEach(b =>
            b.setAttribute('aria-pressed', String(b.dataset.k === scope)));
        document.querySelectorAll('#mode-seg button').forEach(b =>
            b.setAttribute('aria-pressed', String(b.dataset.k === mode)));
        document.querySelectorAll('#loved-seg button').forEach(b =>
            b.setAttribute('aria-pressed', String(b.dataset.k === (withLoved ? '1' : '0'))));

        const sel = document.querySelector('#tabs button[aria-selected="true"]');
        if (sel) $('tabs').scrollLeft = Math.max(0, sel.offsetLeft - 16);

        if (!bnData && !mapperData) {
            $('rows').innerHTML = '<div class="blank">Loading the board…</div>';
            $('pager').innerHTML = '';
            $('podium-slot').innerHTML = '';
            return;
        }

        let all = BUILD[board]();
        all.forEach((r, i) => r.rank = i + 1);      // rank before filtering, so it stays global

        const rows = query ? all.filter(r => r.key.toLowerCase().includes(query)) : all;
        const totalPages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
        const p = pages[board] = Math.min(pages[board], totalPages);
        const slice = rows.slice((p - 1) * PER_PAGE, p * PER_PAGE);

        // The podium is a way in, not a summary: it goes when you start looking for someone,
        // and the list picks up at four so the same three never appear twice on one screen.
        const showPodium = !query && p === 1 && all.length > 3;
        $('podium-slot').innerHTML = showPodium ? podium(all.slice(0, 3), BOARDS[board].unit) : '';
        const shown = showPodium ? slice.slice(3) : slice;

        if (!shown.length) {
            $('rows').innerHTML = `<div class="blank">Nobody here matches <strong>${esc(query)}</strong>. `
                + `Check the spelling, or clear the search to see the whole board.</div>`;
        } else {
            $('rows').innerHTML = shown.map(r => {
                const cls = r.rank <= 3 ? ` top r${r.rank}` : '';
                return `<div class="row${cls}">`
                    + `<span class="rank">${r.rank}</span>`
                    + avatar(r)
                    + `<span class="who">${r.who}</span>`
                    + `<span class="n">${r.main}${r.sub ? `<span class="sub">${r.sub}</span>` : ''}</span>`
                    + `</div>`;
            }).join('');
        }
        pager(p, totalPages, rows.length);
    }

    function podium(three, unit) {
        return '<div class="podium">' + three.map((r, i) => `
            <div class="plinth p${i + 1}">
                <div class="place">${i + 1}</div>
                ${avatar(r)}
                <div class="body">
                    <span class="who">${r.who}</span>
                    <div class="tally">${r.main}</div>
                    <div class="unit">${unit.toLowerCase()}</div>
                </div>
                ${r.sub ? `<div class="extra">${r.sub}</div>` : ''}
            </div>`).join('') + '</div>';
    }

    function pager(p, totalPages, count) {
        if (totalPages <= 1) {
            $('pager').innerHTML = `<span>${num(count)} ${count === 1 ? 'entry' : 'entries'}</span>`;
            return;
        }
        $('pager').innerHTML =
            `<button type="button" id="prev" ${p === 1 ? 'disabled' : ''}>Previous</button>`
            + `<span>Page <input type="number" id="jump" min="1" max="${totalPages}" value="${p}"> of ${totalPages}</span>`
            + `<button type="button" id="next" ${p === totalPages ? 'disabled' : ''}>Next</button>`;
        $('prev').onclick = () => turn(p - 1);
        $('next').onclick = () => turn(p + 1);
        $('jump').onchange = e => turn(Math.min(totalPages, Math.max(1, parseInt(e.target.value, 10) || 1)));
    }

    function turn(to) {
        pages[board] = to;
        render();
        document.querySelector('.list').scrollIntoView({ block: 'start' });
    }

    function stats() {
        const bn = board === 'bns' || board === 'duos';
        const d = bn ? bnData : mapperData;
        if (!d?.last_scan) { $('stats').innerHTML = ''; return; }

        // The scanner writes datetime.utcnow(), which carries no offset: read as local it
        // would drift by the reader's own timezone, so it is pinned to UTC and labelled.
        const t = new Date(d.last_scan + (/[Z+]|-\d\d:\d\d$/.test(d.last_scan) ? '' : 'Z'));
        const on = t.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
        const at = t.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'UTC' });
        const chip = (n, label) => `<span><b>${num(n)}</b>${label}</span>`;

        $('stats').innerHTML = chip(d.total_sets_scanned, 'mapsets scanned')
            + chip(bn ? d.total_bns_scanned : d.total_mappers, bn ? 'nominators' : 'mappers')
            + `<span>${on} \u00b7 ${at} UTC</span>`;
    }

    /* ---------------- wiring ---------------- */

    $('tabs').innerHTML = Object.entries(BOARDS).map(([k, v]) =>
        `<button type="button" role="tab" data-k="${k}" aria-selected="false">${v.tab}</button>`).join('');
    $('scope-seg').innerHTML = SCOPES.map(([k, l]) =>
        `<button type="button" data-k="${k}" aria-pressed="false">${l}</button>`).join('');
    $('mode-seg').innerHTML = MODES.map(([k, l]) =>
        `<button type="button" data-k="${k}" aria-pressed="false">${l}</button>`).join('');
    $('loved-seg').innerHTML = LOVED.map(([k, l]) =>
        `<button type="button" data-k="${k}" aria-pressed="false">${l}</button>`).join('');

    $('tabs').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        board = b.dataset.k;
        syncURL(); stats(); render();
    };
    $('scope-seg').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        scope = b.dataset.k;
        pages.mappers = pages.sets = 1;
        syncURL(); render();
    };
    $('mode-seg').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        mode = b.dataset.k;
        Object.keys(pages).forEach(k => pages[k] = 1);
        syncURL(); render();
    };
    $('loved-seg').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        withLoved = b.dataset.k === '1';
        pages.mappers = pages.sets = 1;
        syncURL(); render();
    };
    $('q').oninput = e => {
        query = e.target.value.trim().toLowerCase();
        Object.keys(pages).forEach(k => pages[k] = 1);
        render();
    };
    $('q-clear').onclick = () => {
        $('q').value = ''; query = '';
        render();
        $('q').focus();
    };

    render();

    fetch('/api/next/leaderboard_data').then(r => r.json()).then(d => {
        bnData = d; stats(); render();
    }).catch(() => { });

    fetch('/api/next/mappers_data').then(r => r.json()).then(d => {
        mapperData = d;
        scopeAvailable = 'own_playcount' in ((d.mappers || [])[0] || {});
        stats(); render();
    }).catch(() => { });
</script>
{% endblock %}
