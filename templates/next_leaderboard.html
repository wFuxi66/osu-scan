{% extends "next_base.html" %}
{% set page = 'ladders' %}
{% block title %}Leaderboards — osu!scan{% endblock %}

{% block content %}
<section class="page-head">
    <h1 class="wide" id="head-title">Leaderboards</h1>
    <p id="head-desc"></p>
</section>

<div class="tabs" role="tablist" id="tabs"></div>

<div class="controls" style="padding-top:18px">
    <div class="control" id="scope-control">
        <label for="scope-seg">Counting</label>
        <div class="seg" id="scope-seg"></div>
    </div>
    <div class="control">
        <label for="mode-seg">Mode</label>
        <div class="seg on-mode" id="mode-seg"></div>
    </div>
    <div class="search">
        <input type="text" id="q" autocomplete="off" spellcheck="false" aria-label="Find someone">
        <button class="clear" type="button" id="q-clear" aria-label="Clear the search" hidden>&times;</button>
    </div>
</div>

<div id="podium-slot"></div>

<div class="list">
    <div class="list-head">
        <span id="col-rank">#</span>
        <span></span>
        <span id="col-who">Mapper</span>
        <span class="n" id="col-n">Total</span>
    </div>
    <div id="rows"></div>
</div>

<div class="pager" id="pager"></div>

<div class="legend" id="legend">
    <span><i class="dot osu"></i>osu!</span>
    <span><i class="dot taiko"></i>Taiko</span>
    <span><i class="dot catch"></i>Catch</span>
    <span><i class="dot mania"></i>Mania</span>
</div>

<details class="note">
    <summary id="note-summary">How this ladder counts</summary>
    <div id="note-body"></div>
</details>

<p class="note stamp" id="stamp"></p>
{% endblock %}

{% block scripts %}
<script>
    const PER_PAGE = 50;

    const LADDERS = {
        bns: {
            tab: 'Top nominators',
            title: 'Top nominators',
            desc: 'Who pushes the most mapsets through to ranked.',
            who: 'Nominator', unit: 'Nominations',
            note: ['A mapset needs two nominators, and it counts once for each of them. Adding this '
                + 'column up therefore gives you roughly twice the number of sets ever ranked, not the '
                + 'size of the ranked pool.'],
            scope: false,
        },
        duos: {
            tab: 'Nominator duos',
            title: 'Nominator duos',
            desc: 'The pairs who keep signing off the same mapsets.',
            who: 'Duo', unit: 'Sets together',
            note: ['A pair only scores when both of them nominated the same mapset, and that set counts '
                + 'once for the pair. Someone who nominates a great deal but rarely with the same partner '
                + 'can top the nominator ladder and be absent from this one.'],
            scope: false,
        },
        mappers: {
            tab: 'Most played mappers',
            title: 'Most played mappers',
            desc: 'Ranked by the plays on every difficulty they had a hand in.',
            who: 'Mapper', unit: 'Plays',
            note: ['A difficulty made by several mappers counts its full playcount for every one of them. '
                + 'That is why these totals run higher than sites crediting only the set host, and why '
                + 'adding the column up gives more plays than the ranked pool actually holds.',
            'Ranked and loved difficulties are both in here; the loved figure is called out under each total.'],
            scope: true,
        },
        sets: {
            tab: 'Most ranked sets',
            title: 'Most ranked mapsets',
            desc: 'How many mapsets each mapper hosted or appeared on.',
            who: 'Mapper', unit: 'Mapsets',
            note: ['One mapset counts once, however many difficulties sit on it — five difficulties on a set '
                + 'you host is one ranked set, the way osu! counts it on a profile.',
            'A set counts for whoever hosted it, even when every difficulty on it was made by a guest.',
            'Ranked and loved only. Approved and qualified sets are not in this scan, which is why a '
                + 'profile can show a handful more than we do.'],
            scope: true,
        },
    };

    const SCOPES = [['all', 'Everything'], ['own', 'As host'], ['guest', 'As guest']];
    const MODES = [['all', 'All'], ['osu', 'osu!'], ['taiko', 'Taiko'], ['catch', 'Catch'], ['mania', 'Mania']];

    let bnData = null, mapperData = null, scopeAvailable = false;
    let ladder = 'bns', scope = 'all', mode = 'all', query = '';
    const pages = { bns: 1, duos: 1, mappers: 1, sets: 1 };

    const $ = id => document.getElementById(id);
    const num = n => (n || 0).toLocaleString('en-US');
    const COMPACT = new Intl.NumberFormat('en-US', { notation: 'compact', maximumFractionDigits: 1 });

    // A restricted or deleted account comes back as a placeholder; there is no profile to link to.
    const GONE = /^(User_\d+|ID:\d+)$/;
    const nameCell = (id, name) => GONE.test(name)
        ? '<a class="gone">Restricted account</a>'
        : `<a href="https://osu.ppy.sh/users/${id}" target="_blank" rel="noopener">${esc(name)}</a>`;

    function esc(s) {
        const el = document.createElement('span');
        el.textContent = s == null ? '' : s;
        return el.innerHTML;
    }

    // The initial sits underneath, so a missing avatar degrades to a letter, not an empty tile.
    const face = (id, name, cls) =>
        `<span class="${cls}">${GONE.test(name) ? '?' : esc((name || '?').trim().charAt(0).toUpperCase())}`
        + `<img src="https://a.ppy.sh/${id}" alt="" loading="lazy" decoding="async"`
        + ` onerror="this.remove()"></span>`;

    function dots(byMode) {
        const keys = Object.keys(byMode || {}).filter(k => (byMode[k] || 0) > 0);
        if (mode !== 'all' || !keys.length) return '';
        return '<span class="modes">' + keys.map(k => `<i class="dot ${k}" title="${k}"></i>`).join('') + '</span>';
    }

    function pick(byMode, total) {
        if (mode === 'all') return total || 0;
        const d = byMode || {};
        if (mode === 'catch') return (d.catch || 0) + (d.fruits || 0);
        return d[mode] || 0;
    }

    /* ---------------- rows: every builder returns the full ranked ladder ---------------- */

    function rowsBns() {
        const out = [];
        for (const bn of (bnData?.top_bns || [])) {
            const v = pick(bn.by_mode, bn.total);
            if (v > 0) out.push({
                key: bn.username, id: bn.osu_id, value: v, main: num(v),
                who: nameCell(bn.osu_id, bn.username) + dots(bn.by_mode),
            });
        }
        return out.sort((a, b) => b.value - a.value);
    }

    function rowsDuos() {
        let duos = bnData?.duos || [];
        if (mode !== 'all') {
            duos = duos.filter(d => mode === 'catch'
                ? (d.mode === 'catch' || d.mode === 'fruits') : d.mode === mode);
        }
        return duos.slice().sort((a, b) => b.count - a.count).map(d => ({
            key: `${d.bn1_name} ${d.bn2_name}`, id: d.bn1_id, id2: d.bn2_id,
            value: d.count, main: num(d.count),
            who: nameCell(d.bn1_id, d.bn1_name) + '<span class="pair">+</span>'
                + nameCell(d.bn2_id, d.bn2_name) + dots({ [d.mode]: 1 }),
        }));
    }

    // Only the "own" figures are stored, so a guest figure is the remainder.
    function mapperRows(valueOf, subOf) {
        const out = [];
        for (const m of (mapperData?.mappers || [])) {
            const f = mode === 'all'
                ? ['playcount', 'own_playcount', 'maps', 'own_maps', 'loved_playcount', 'own_loved_playcount', 'sets', 'own_sets']
                : ['by_mode', 'own_by_mode', 'maps_by_mode', 'own_maps_by_mode', 'loved_by_mode', 'own_loved_by_mode', 'sets_by_mode', 'own_sets_by_mode'];
            const g = k => mode === 'all' ? (m[k] || 0) : pick(m[k], 0);
            const [allPc, ownPc, allMaps, ownMaps, allLoved, ownLoved, allSets, ownSets] = f.map(g);

            let pc, maps, loved, sets;
            if (scope === 'own') { pc = ownPc; maps = ownMaps; loved = ownLoved; sets = ownSets; }
            else if (scope === 'guest') { pc = allPc - ownPc; maps = allMaps - ownMaps; loved = allLoved - ownLoved; sets = allSets - ownSets; }
            else { pc = allPc; maps = allMaps; loved = allLoved; sets = allSets; }

            if (pc <= 0) continue;
            out.push({ name: m.username, id: m.osu_id, by_mode: m.by_mode, pc, maps, loved, sets });
        }
        out.sort((a, b) => valueOf(b) - valueOf(a) || b.pc - a.pc);
        return out.map(m => ({
            key: m.name, id: m.id, value: valueOf(m),
            main: num(valueOf(m)), sub: subOf(m),
            who: nameCell(m.id, m.name) + dots(m.by_mode),
        }));
    }

    const rowsMappers = () => mapperRows(m => m.pc, m =>
        `${num(m.maps)} difficulties` + (m.loved > 0 ? ` · ${COMPACT.format(m.loved)} loved` : ''));
    const rowsSets = () => mapperRows(m => m.sets, () => '');

    const BUILD = { bns: rowsBns, duos: rowsDuos, mappers: rowsMappers, sets: rowsSets };

    /* ---------------- render ---------------- */

    function render() {
        const cfg = LADDERS[ladder];
        $('head-title').textContent = cfg.title;
        $('head-desc').textContent = cfg.desc;
        $('col-who').textContent = cfg.who;
        $('col-n').textContent = cfg.unit;
        $('scope-control').hidden = !(cfg.scope && scopeAvailable);
        $('legend').hidden = mode !== 'all';
        $('note-body').innerHTML = cfg.note.map(p => `<p>${p}</p>`).join('');
        $('q').placeholder = ladder === 'duos' ? 'Find a nominator' : 'Find yourself, or anyone else';
        $('q-clear').hidden = query === '';

        document.querySelectorAll('#tabs button').forEach(b =>
            b.setAttribute('aria-selected', String(b.dataset.k === ladder)));
        document.querySelectorAll('#scope-seg button').forEach(b =>
            b.setAttribute('aria-pressed', String(b.dataset.k === scope)));
        document.querySelectorAll('#mode-seg button').forEach(b =>
            b.setAttribute('aria-pressed', String(b.dataset.k === mode)));

        const sel = document.querySelector('#tabs button[aria-selected="true"]');
        if (sel) $('tabs').scrollLeft = Math.max(0, sel.offsetLeft - 16);

        if (!bnData && !mapperData) {
            $('rows').innerHTML = '<div class="blank">Loading the ladder…</div>';
            $('pager').innerHTML = '';
            $('podium-slot').innerHTML = '';
            return;
        }

        let all = BUILD[ladder]();
        all.forEach((r, i) => r.rank = i + 1);      // rank before filtering, so it stays global
        const top = all.length ? all[0].value : 1;  // and the bar means the same on every page

        const rows = query ? all.filter(r => r.key.toLowerCase().includes(query)) : all;
        const totalPages = Math.max(1, Math.ceil(rows.length / PER_PAGE));
        const p = pages[ladder] = Math.min(pages[ladder], totalPages);
        const slice = rows.slice((p - 1) * PER_PAGE, p * PER_PAGE);

        // The podium is a way in, not a summary: it goes when you start looking for someone,
        // and the list picks up at four so the same three never appear twice on one screen.
        const showPodium = !query && p === 1 && all.length > 3;
        $('podium-slot').innerHTML = showPodium ? podium(all.slice(0, 3), LADDERS[ladder].unit) : '';
        const shown = showPodium ? slice.slice(3) : slice;

        if (!shown.length) {
            $('rows').innerHTML = `<div class="blank">Nobody here matches <strong>${esc(query)}</strong>. `
                + `Check the spelling, or clear the search to see the whole ladder.</div>`;
        } else {
            $('rows').innerHTML = shown.map(r => {
                const cls = r.rank <= 3 ? ` top r${r.rank}` : '';
                const share = Math.max(0.6, (r.value / (top || 1)) * 100).toFixed(1);
                return `<div class="row${cls}" title="${Math.round(r.value / (top || 1) * 100)}% of the top spot">`
                    + `<span class="lvl" style="width:${share}%"></span>`
                    + `<span class="rank">${r.rank}</span>`
                    + face(r.id, r.key, 'face')
                    + `<span class="who">${r.who}</span>`
                    + `<span class="n">${r.main}${r.sub ? `<span class="sub">${r.sub}</span>` : ''}</span>`
                    + `</div>`;
            }).join('');
        }
        pager(p, totalPages, rows.length);
    }

    function podium(three, unit) {
        return '<div class="podium">' + three.map((r, i) => `
            <div class="plinth p${i + 1}">
                <div class="place">${i + 1}</div>
                ${face(r.id, r.key, 'face')}
                <div class="body">
                    <span class="who">${r.who.replace(/<a /g, '<a class="who" ')}</span>
                    <div class="tally">${r.main}</div>
                    <div class="unit">${unit.toLowerCase()}</div>
                </div>
            </div>`).join('') + '</div>';
    }

    function pager(p, totalPages, count) {
        if (totalPages <= 1) {
            $('pager').innerHTML = `<span>${num(count)} ${count === 1 ? 'entry' : 'entries'}</span>`;
            return;
        }
        $('pager').innerHTML =
            `<button type="button" id="prev" ${p === 1 ? 'disabled' : ''}>Previous</button>`
            + `<span>Page <input type="number" id="jump" min="1" max="${totalPages}" value="${p}"> of ${totalPages}</span>`
            + `<button type="button" id="next" ${p === totalPages ? 'disabled' : ''}>Next</button>`;
        $('prev').onclick = () => turn(p - 1);
        $('next').onclick = () => turn(p + 1);
        $('jump').onchange = e => turn(Math.min(totalPages, Math.max(1, parseInt(e.target.value, 10) || 1)));
    }

    function turn(to) {
        pages[ladder] = to;
        render();
        document.querySelector('.list').scrollIntoView({ block: 'start' });
    }

    function stamp() {
        const bn = ladder === 'bns' || ladder === 'duos';
        const when = bn ? bnData?.last_scan : mapperData?.last_scan;
        if (!when) { $('stamp').textContent = ''; return; }
        const d = new Date(when).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
        $('stamp').textContent = bn
            ? `Rebuilt ${d} over ${num(bnData?.total_bns_scanned)} nominators.`
            : `Rebuilt ${d} over ${num(mapperData?.total_sets_scanned)} mapsets `
            + `and ${num(mapperData?.total_mappers)} mappers.`;
    }

    /* ---------------- wiring ---------------- */

    $('tabs').innerHTML = Object.entries(LADDERS).map(([k, v]) =>
        `<button type="button" role="tab" data-k="${k}" aria-selected="false">${v.tab}</button>`).join('');
    $('scope-seg').innerHTML = SCOPES.map(([k, l]) =>
        `<button type="button" data-k="${k}" aria-pressed="false">${l}</button>`).join('');
    $('mode-seg').innerHTML = MODES.map(([k, l]) =>
        `<button type="button" data-k="${k}" aria-pressed="false">${l}</button>`).join('');

    $('tabs').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        ladder = b.dataset.k;
        stamp(); render();
    };
    $('scope-seg').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        scope = b.dataset.k;
        pages.mappers = pages.sets = 1;
        render();
    };
    $('mode-seg').onclick = e => {
        const b = e.target.closest('button');
        if (!b) return;
        mode = b.dataset.k;
        Object.keys(pages).forEach(k => pages[k] = 1);
        render();
    };
    $('q').oninput = e => {
        query = e.target.value.trim().toLowerCase();
        Object.keys(pages).forEach(k => pages[k] = 1);
        render();
    };
    $('q-clear').onclick = () => {
        $('q').value = ''; query = '';
        render();
        $('q').focus();
    };

    render();

    fetch('/api/leaderboard_data').then(r => r.json()).then(d => {
        bnData = d; stamp(); render();
    }).catch(() => { });

    fetch('/api/mappers_data').then(r => r.json()).then(d => {
        mapperData = d;
        scopeAvailable = 'own_playcount' in ((d.mappers || [])[0] || {});
        stamp(); render();
    }).catch(() => { });
</script>
{% endblock %}
