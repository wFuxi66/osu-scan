name: Site Scan

# Fills the `preprod/` Firebase prefix, which is what the live site reads - the name is
# historical, from when this prefix was a rehearsal the /next preview pointed at. The
# unprefixed `leaderboard` and `mappers` paths are empty and nothing serves them.
#
# Both scans run every night. The mapper scan used to run twice a week, on the grounds that
# a daily re-crawl of all ~60k mapsets only finds the ~30 sets that ranked that day, for
# playcount shifts too small to reorder a ladder whose top entries have millions of plays.
# That part is still true, and it is not what the schedule is for.
#
# The profile pass is. It is budgeted at 90 minutes and gets through ~1700 mappers of the
# ~8400, against ~4200 that fall due each run, so twice a week it never caught up: the
# 2026-09-14 run still had 2449 mappers whose official counts had never been read at all.
# Nightly gives it ~12k readings a week against a ladder of 8400, which is the first figure
# that clears the backlog rather than treading water. The mapping-subscriber board rides
# entirely on that pass, so its freshness is the pass's freshness.
#
# Not one longer run instead: the cache is only written once the pass finishes, so a runner
# killed near the 6 hour ceiling loses the whole thing. Seven 90-minute passes each written
# down beat two 240-minute gambles.
#
# Frequency is not what caused the 2026-09-11 throttling - the rate was, and OSU_RATE_PER_MIN
# below fixed it. That rate is per minute and shared by every thread, so it is untouched by
# how many nights a week the scan runs. Two full mapper scans inside seven hours on
# 2026-09-14 drew no 429 at all, which is a heavier day than this schedule can produce.
#
# The second cron below is the catch-up. A board that has just gained a profile field starts
# empty and fills at the pass's ~1250 mappers a run, so nightly alone takes a week to light
# it up - the mapping-subscriber board landed on 2026-09-15 with 1259 of 8399 mappers on it.
# Every three hours clears that in a day. It is not a temporary line to be reverted by hand:
# the "Decide which scans this run does" step below turns it off again the moment no mapper
# is missing a figure, so it only ever fires while there is a backlog, and the next new
# profile field gets the same head start for free.
on:
  schedule:
    - cron: '0 0 * * *'
    # Catch-up; skipped when there is no backlog. Off the midnight mark, which the nightly
    # run above already owns - two crons matching one minute would fire two runs.
    - cron: '0 3,6,9,12,15,18,21 * * *'
  workflow_dispatch:
    inputs:
      scans:
        description: 'Which scans to run'
        type: choice
        default: 'both'
        options: [both, mappers, bn]

jobs:
  run-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    # Only for the keepalive step at the end, which pushes an empty commit.
    permissions:
      contents: write

    # Never let two preprod runs write the same prefix at once.
    concurrency:
      group: preprod-scan
      cancel-in-progress: false

    env:
      PYTHONUNBUFFERED: "1"
      # osu! asks for 60 requests a minute. The 2026-09-11 run sat at ~75 and tripped a
      # flat 1800s hold roughly every 45 minutes - and a fixed penalty means going faster
      # only collects it more often, never sooner-and-done. Staying under the line is both
      # politer and, once the holds are counted, quicker.
      OSU_RATE_PER_MIN: "60"
      OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
      OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
      FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
      FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
      FIREBASE_NS: preprod
      # Its own checkpoint and cache, so a preprod run never resumes from the monthly one
      # or inherits its cached owners.
      MAPPER_SCAN_STATE: preprod_scan_state.pickle
      MAPPER_SCAN_CACHE: preprod_scan_cache.pickle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refuse to run without Firebase
        run: |
          if [ -z "$FIREBASE_URL" ] || [ -z "$FIREBASE_SECRET" ]; then
            echo "::error::FIREBASE_URL / FIREBASE_SECRET are not set. Without them the scan"
            echo "::error::writes local files the runner throws away, so it would look green"
            echo "::error::and change nothing. Add the secrets, then re-run."
            exit 1
          fi

      # One place deciding what runs, rather than the same event test copied onto five steps.
      # A catch-up run earns its place only if the published ladder still has mappers without
      # a subscriber figure; a failed or unreadable check counts as no backlog, so the quiet
      # answer is always to skip rather than to crawl 60k mapsets on a bad reading.
      - name: Decide which scans this run does
        id: plan
        run: |
          mappers=no
          bn=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.scans }}" != "bn" ]; then mappers=yes; fi
            if [ "${{ inputs.scans }}" != "mappers" ]; then bn=yes; fi
          elif [ "${{ github.event.schedule }}" = "0 0 * * *" ]; then
            mappers=yes
            bn=yes
          else
            missing=$(curl -s --compressed --max-time 120 \
              https://osu-scan.onrender.com/api/mappers_data \
              | python3 -c "import json,sys; rows = json.load(sys.stdin).get('mappers') or []; print(sum(1 for r in rows if 'profile_mapping_subs' not in r))" 2>/dev/null) || missing=""
            # Anything that is not a plain count - an error page, a timeout, an empty body -
            # reads as no backlog, so a bad check costs a skipped catch-up, never a crawl.
            case "$missing" in ''|*[!0-9]*) missing=0 ;; esac
            echo "$missing mapper(s) still without a subscriber figure."
            if [ "$missing" -gt 0 ]; then mappers=yes; fi
          fi
          echo "Mapper scan: $mappers. BN scan: $bn."
          echo "mappers=$mappers" >> "$GITHUB_OUTPUT"
          echo "bn=$bn" >> "$GITHUB_OUTPUT"

      # The mapper scan checkpoints as it goes; carrying that file between runs means a
      # killed runner or a rate-limit wall resumes instead of starting ~60k mapsets over.
      - name: Restore mapper scan checkpoint
        if: ${{ steps.plan.outputs.mappers == 'yes' }}
        uses: actions/cache/restore@v4
        with:
          path: |
            preprod_scan_state.pickle
            preprod_scan_cache.pickle
          key: preprod-mapper-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: preprod-mapper-

      - name: Run mapper scan
        id: mapper_scan
        if: ${{ steps.plan.outputs.mappers == 'yes' }}
        continue-on-error: true
        run: |
          for attempt in 1 2 3 4; do
            echo "::group::Mapper scan attempt $attempt"
            python run_scan.py mappers && exit 0
            echo "::endgroup::"
            echo "Attempt $attempt stopped short; resuming from the checkpoint in 2 minutes."
            sleep 120
          done
          exit 1

      - name: Save mapper scan checkpoint
        if: ${{ always() && steps.plan.outputs.mappers == 'yes' }}
        uses: actions/cache/save@v4
        with:
          path: |
            preprod_scan_state.pickle
            preprod_scan_cache.pickle
          key: preprod-mapper-${{ github.run_id }}-${{ github.run_attempt }}

      # A failed mapper scan must not cancel the BN scan, but a silent green run would
      # hide it, so it is reported here and the job fails at the end.
      - name: Report mapper scan failure
        if: always() && steps.mapper_scan.outcome == 'failure'
        run: echo "::error::Mapper scan failed after 4 attempts. Its checkpoint is cached; re-run to continue."

      - name: Run BN scan
        if: ${{ steps.plan.outputs.bn == 'yes' }}
        run: python run_scan.py bn

      # GitHub disables a scheduled workflow after 60 days of repository inactivity, and
      # this is the only scheduled one: the site would simply stop updating, with nothing to
      # see but a last-scan date getting older. An empty commit resets that clock - but only
      # when nothing else has, because one every night would bury the history under a problem
      # that never happened.
      - name: Keep the schedule alive
        if: always() && github.event.schedule == '0 0 * * *'
        continue-on-error: true
        run: |
          quiet_days=$(( ($(date -u +%s) - $(git log -1 --format=%ct)) / 86400 ))
          echo "Last commit on the default branch: $quiet_days days ago."
          if [ "$quiet_days" -lt 30 ]; then
            echo "The repository is active; nothing to keep alive."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep the scan schedule alive [skip ci]"
          git push

      - name: Fail the run if the mapper scan never finished
        if: always() && steps.mapper_scan.outcome == 'failure'
        run: exit 1
