name: Global Monthly Scan

on:
  schedule:
    # Runs at 00:00 UTC on the 1st of every month
    - cron: '0 0 1 * *'
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  run-scan:
    runs-on: ubuntu-latest
    
    # Optional: ensure only one scan runs at a time
    concurrency:
      group: global-scan
      cancel-in-progress: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # The mapper scan checkpoints its progress; carrying that file between runs means a
    # killed runner or a rate-limit wall resumes instead of starting the ~59k mapsets over.
    - name: Restore mapper scan checkpoint
      uses: actions/cache/restore@v4
      with:
        path: mapper_scan_state.pickle
        key: mapper-scan-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: mapper-scan-

    - name: Run Mapper Scan
      id: mapper_scan
      continue-on-error: true  # a stalled mapper scan must not cancel the BN scan
      env:
        PYTHONUNBUFFERED: "1"
        OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
        OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
      run: |
        for attempt in 1 2 3; do
          echo "::group::Mapper scan attempt $attempt"
          python run_scan.py mappers && exit 0
          echo "::endgroup::"
          echo "Attempt $attempt stopped short; resuming from the checkpoint in 2 minutes."
          sleep 120
        done
        exit 1

    - name: Save mapper scan checkpoint
      if: always()
      uses: actions/cache/save@v4
      with:
        path: mapper_scan_state.pickle
        key: mapper-scan-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Run BN Scan
      env:
        PYTHONUNBUFFERED: "1"
        OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
        OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
      run: |
        python run_scan.py bn

    - name: Keep Workflow Alive
      continue-on-error: true
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit --allow-empty -m "chore: keepalive [skip ci]" || true
        git push || true
