name: Global Monthly Scan

# Writes the UNPREFIXED `leaderboard` and `mappers` paths. The site does not read those -
# it reads the `preprod/` prefix that Site Scan fills - so this ran monthly for hours and
# published where nothing was listening. The schedule is gone; keep it manual, for the day
# the namespace is cut over.
on:
  workflow_dispatch: # Allows manual triggering from the GitHub Actions tab

jobs:
  run-scan:
    runs-on: ubuntu-latest
    
    # Optional: ensure only one scan runs at a time
    concurrency:
      group: global-scan
      cancel-in-progress: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # The mapper scan checkpoints its progress; carrying that file between runs means a
    # killed runner or a rate-limit wall resumes instead of starting the ~59k mapsets over.
    - name: Restore mapper scan checkpoint
      uses: actions/cache/restore@v4
      with:
        path: |
          mapper_scan_state.pickle
          mapper_scan_cache.pickle
        key: mapper-scan-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: mapper-scan-

    - name: Run Mapper Scan
      id: mapper_scan
      continue-on-error: true  # a stalled mapper scan must not cancel the BN scan
      env:
        PYTHONUNBUFFERED: "1"
        # osu! asks for 60 requests a minute. The 2026-09-11 run sat at ~75 and tripped a
        # flat 1800s hold roughly every 45 minutes - and a fixed penalty means going faster
        # only collects it more often, never sooner-and-done. Staying under the line is both
        # politer and, once the holds are counted, quicker.
        OSU_RATE_PER_MIN: "60"
        OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
        OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
      run: |
        for attempt in 1 2 3; do
          echo "::group::Mapper scan attempt $attempt"
          python run_scan.py mappers && exit 0
          echo "::endgroup::"
          echo "Attempt $attempt stopped short; resuming from the checkpoint in 2 minutes."
          sleep 120
        done
        exit 1

    - name: Save mapper scan checkpoint
      if: always()
      uses: actions/cache/save@v4
      with:
        path: |
          mapper_scan_state.pickle
          mapper_scan_cache.pickle
        key: mapper-scan-${{ github.run_id }}-${{ github.run_attempt }}

    # continue-on-error keeps the BN scan alive, but a silent green run would hide three
    # failed mapper attempts, so surface it once the BN scan has had its turn.
    - name: Report mapper scan failure
      if: always() && steps.mapper_scan.outcome == 'failure'
      run: |
        echo "::error::Mapper scan failed after 3 attempts. Its checkpoint is cached; re-run to continue."

    - name: Run BN Scan
      env:
        PYTHONUNBUFFERED: "1"
        OSU_CLIENT_ID: ${{ secrets.OSU_CLIENT_ID }}
        OSU_CLIENT_SECRET: ${{ secrets.OSU_CLIENT_SECRET }}
        FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        FIREBASE_SECRET: ${{ secrets.FIREBASE_SECRET }}
      run: |
        python run_scan.py bn

    - name: Keep Workflow Alive
      continue-on-error: true
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git commit --allow-empty -m "chore: keepalive [skip ci]" || true
        git push || true

    - name: Fail the run if the mapper scan never finished
      if: always() && steps.mapper_scan.outcome == 'failure'
      run: exit 1
